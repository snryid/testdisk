[package]
name = "app-v1"
version = "0.1.0"
description = "Mini TestDisk (Tauri 1.x — Ubuntu 20.04 compatible)"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_v1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "1.8", features = ["dialog-open", "dialog-save"] }
testdisk-core = { path = "../crates/testdisk-core" }
testdisk-platform = { path = "../crates/testdisk-platform" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
